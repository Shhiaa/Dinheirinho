name: CI/CD - Dinheirinho

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # JOB 1: CI - valida o index.html
  # ---------------------------------------------------------------
  ci:
    name: Validar HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          for f in index.html css/style.css js/app.js; do
            test -f "$f" || { echo "::error::Arquivo $f não encontrado"; exit 1; }
          done

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar ferramentas de validação
        run: npm install --global html-validate@9

      - name: Criar configuração do html-validate (se não existir)
        run: |
          if [ ! -f .htmlvalidate.json ]; then
            echo '{ "extends": ["html-validate:recommended"] }' > .htmlvalidate.json
          fi

      - name: Validar index.html
        run: html-validate index.html

      - name: Garantir que a chave service_role não está no código
        run: |
          for t in $(grep -rhoE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' index.html js css | sort -u); do
            payload=$(echo "$t" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
            if echo "$payload" | base64 -d 2>/dev/null | grep -q '"service_role"'; then
              echo "::error::Chave service_role do Supabase encontrada no código!"
              exit 1
            fi
          done
          echo "Nenhuma chave service_role encontrada."

      - name: Checar sintaxe do JavaScript
        run: |
          for f in js/*.js; do
            node --check "$f" || { echo "::error file=$f::erro de sintaxe"; exit 1; }
          done

      - name: Verificar tamanho do index.html
        run: |
          tamanho=$(cat index.html css/*.css js/*.js | wc -c)
          limite=$((500 * 1024))
          echo "Total: $((tamanho / 1024)) KB"
          [ "$tamanho" -le "$limite" ] || { echo "::error::Site passou de 500 KB"; exit 1; }

      - name: Procurar restos de debug
        run: |
          if grep -rnE '\bdebugger\b|console\.log\(|TODO|FIXME' index.html js css > /tmp/debug.txt; then
            sed 's/^/::warning::/' /tmp/debug.txt
          else
            echo "Nada encontrado."
          fi

      - name: Verificar links quebrados
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude-loopback
            --exclude 'supabase\.co'
            --exclude '^https://fonts\.googleapis\.com/?$'
            --exclude '^https://fonts\.gstatic\.com/?$'
            index.html
          fail: true

  # ---------------------------------------------------------------
  # JOB 2: Deploy - só roda em push na main e se o CI passar
  # ---------------------------------------------------------------
  deploy:
    name: Deploy no GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar se o site está no ar (HTTP 200)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Verificando $PAGE_URL"
          for tentativa in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$PAGE_URL" || echo 000)
            echo "Tentativa $tentativa: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Site no ar."
              exit 0
            fi
            sleep 10
          done
          echo "::error::O site respondeu HTTP $status em vez de 200 ($PAGE_URL)"
          exit 1
